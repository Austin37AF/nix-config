name: Build K8s Installer ISO

on:
  push:
    branches: [main]
    paths:
      - 'modules/kubernetes/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/build-iso.yaml'
  workflow_dispatch:  # Manual trigger

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true  # Don't fail if no cachix token

      - name: Build ISO
        run: |
          nix build .#packages.x86_64-linux.k8s-installer-iso --print-build-logs

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: k8s-installer-iso
          path: result/iso/*.iso
          retention-days: 3
