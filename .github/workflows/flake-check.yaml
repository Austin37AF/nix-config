name: Flake Check

# Every machine in hosts/ is its own flake with its own flake.lock, so each one is
# checked in its own job: a failure shows up under that host only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flake-check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Root flake: dev shells + installer ISO
          - name: root
            dir: .
            private: false
          - name: k8s
            dir: ./hosts/k8s
            private: false
          - name: gaming-pc
            dir: ./hosts/gaming-pc
            private: true
          - name: wsl
            dir: ./hosts/wsl
            private: true
          # aarch64-darwin can't be checked on Linux: evaluate both systems instead
          - name: austin-m5-pro
            dir: ./hosts/austin-m5-pro
            private: true
            eval: darwinConfigurations.austin-m5-pro.system.drvPath darwinConfigurations.austin-m5-pro-home.system.drvPath
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true  # Don't fail if no cachix token

      # The heimdall input is git+ssh to a private repo; evaluating a host that uses it
      # fetches it, so the runner needs a key with read access to it.
      # Set FLAKE_INPUT_SSH_KEY to a read-only deploy key on Austin37AF/heimdall.
      - name: Configure SSH for private flake inputs
        if: matrix.private
        env:
          FLAKE_INPUT_SSH_KEY: ${{ secrets.FLAKE_INPUT_SSH_KEY }}
        run: |
          if [ -z "$FLAKE_INPUT_SSH_KEY" ]; then
            echo "FLAKE_INPUT_SSH_KEY not set; private flake inputs will fail to fetch"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$FLAKE_INPUT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: nix flake check
        if: ${{ !matrix.eval }}
        run: nix flake check --print-build-logs "${{ matrix.dir }}"

      - name: Evaluate
        if: ${{ matrix.eval }}
        run: |
          for attr in ${{ matrix.eval }}; do
            echo "$attr"
            nix eval --raw "${{ matrix.dir }}#$attr"; echo
          done
