# Sops configuration
#
# This file defines who can decrypt secrets.
#
# Get your age key:
#   age-keygen -o ~/.config/sops/age/keys.txt
#   cat ~/.config/sops/age/keys.txt | grep "public key"
#
# Node keys are derived from each node's pre-generated SSH host key
# (secrets/host-keys.yaml, installed by scripts/install-node.sh):
#   sops -d --extract '["k8s-server-1"]' secrets/host-keys.yaml | ssh-keygen -y -f /dev/stdin | ssh-to-age

keys:
  # Your personal age key (for encrypting/editing secrets)
  - &admin age1fvykwesuzhgq8dzltmevlkmwlslpxypdkzdq7zhlf9sr75kv2gfsvvxpah

  # Node SSH host keys (converted to age format)
  - &k8s-server-1 age1h3m62jl0lpj99f39jwyat4s5d5znx0zwkh0eulru63a4e50frdkq06nfun
  - &k8s-server-2 age1ank06p8ke8xh8ulqwaw328k36f9ydwc8alg2t0udgrjenmylxg5q223rzg
  - &k8s-server-3 age19yp4m88ryurcv2lax4qwgmzjrmw37e3vms4703952wp8vfmwse3szqdetv
  - &k8s-agent-1 age1sj48l0uc0sxfz4z9y7lyev03u0trth05fz3j5r2c3ganeaj9u5jssqkk2d

creation_rules:
  # Node SSH host private keys: admin only (decrypted on the workstation at install time)
  - path_regex: secrets/host-keys\.yaml$
    key_groups:
      - age:
          - *admin

  # Cluster secrets: admin + every node
  - path_regex: secrets/k8s\.yaml$
    key_groups:
      - age:
          - *admin
          - *k8s-server-1
          - *k8s-server-2
          - *k8s-server-3
          - *k8s-agent-1
