name: Build Installer ISO

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'shared/ssh-keys.nix'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/build-iso.yaml'
  workflow_dispatch:  # Manual trigger

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publish the ISO to the rolling `nixos-installer` release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true  # Don't fail if no cachix token

      - name: Build ISO
        run: |
          nix build .#packages.x86_64-linux.installer-iso --print-build-logs

      # Release assets don't count against the (small) Actions artifact quota.
      # Download: gh release download nixos-installer -R Austin37AF/nix-config
      - name: Publish ISO to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp result/iso/*.iso nixos-installer.iso
          gh release view nixos-installer >/dev/null 2>&1 || \
            gh release create nixos-installer --prerelease --title "NixOS installer ISO" --notes "Rolling build"
          gh release upload nixos-installer nixos-installer.iso --clobber
          gh release edit nixos-installer --notes "Built from ${GITHUB_SHA} on $(date -u +%F)"
